name: office_clockin_alarm
description: "Smart office arrival alarm and clock-in prompt app powered by Wi-Fi detection"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  connectivity_plus: ^6.1.0
  network_info_plus: ^6.1.0
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.3.3
  permission_handler: ^11.3.1
  intl: ^0.19.0
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
